name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  verify-and-build:
    name: Verify and build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for pair in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!pair}" ]; then
              echo "Missing required repository secret: $pair" >&2
              exit 1
            fi
          done

      - name: Generate Android project
        run: npx expo prebuild --non-interactive --clean

      - name: Install internal panel asset
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp assets/panel-5.html android/app/src/main/assets/panel-5.html
          test -s android/app/src/main/assets/panel-5.html
          grep -q "videoCount" android/app/src/main/assets/panel-5.html
          grep -q "theme-change" android/app/src/main/assets/panel-5.html

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mazvideo-release.keystore
          chmod 600 android/app/mazvideo-release.keystore
          keytool -list -keystore android/app/mazvideo-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          node scripts/prepare-android-build.mjs
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --refresh-dependencies --stacktrace assembleRelease 2>&1 | tee ../gradle-build.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt $attempt failed; retrying after Maven backoff..." >&2
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Verify APK structure and signature
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS_DIR"
          export PATH="$BUILD_TOOLS_DIR:$SDK_ROOT/platform-tools:$PATH"
          command -v apksigner
          command -v zipalign
          command -v aapt
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -qi "V2 Signer: certificate SHA-256 digest: 138b8124cc3fcc62c74fa79e4955b1eb280e09162a511c2195d424ca2fe6d7a7" apk-signature.txt
          zipalign -c -v 4 "$APK" | tail -1
          aapt dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label" | head -5
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazvideo-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            apk-signature.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mazvideo-build-diagnostics
          path: |
            gradle-build.log
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: warn
          retention-days: 14
